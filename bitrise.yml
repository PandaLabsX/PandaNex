---
format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android

# ==============================================================================
# PandaNex — Bitrise CI/CD Configuration (Optimized for Free Hobby Plan)
# Stack: Linux Docker Ubuntu 22.04 Android (1x credit/min on Hobby Plan)
# ==============================================================================
meta:
  bitrise.io:
    stack: linux-docker-android-22.04
    machine_type_id: standard

app:
  envs:
    - PROJECT_LOCATION: "."
    - MODULE: "app"
    - GRADLEW_PATH: "./gradlew"
    - ANDROID_COMPILE_SDK: "36"
    - ANDROID_BUILD_TOOLS: "36.0.0"

trigger_map:
  - push_branch: main
    workflow: pandanex-debug
  - push_branch: master
    workflow: pandanex-debug
  - pull_request_source_branch: "*"
    workflow: pandanex-debug
  - tag: "v*"
    workflow: pandanex-release

workflows:
  # ============================================================================
  # Workflow 1: Debug APK Build (pandanex-debug)
  # Builds, validates, and deploys app/build/outputs/apk/debug/app-debug.apk
  # ============================================================================
  pandanex-debug:
    description: >-
      Builds a downloadable PandaNex Debug APK using the project Gradle wrapper,
      Gradle build caching, and fast Hobby-plan-optimized Linux settings.
    steps:
      - activate-ssh-key@4:
          title: Activate SSH Key (if SSH Git URL is used)
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'

      - git-clone@8:
          title: Clone PandaNex Repository (Shallow Clone)
          inputs:
            - clone_depth: "1"

      - set-java-version@1:
          title: Set JDK 21 (Compatible with Gradle 9.3.1 & AGP 9.1.1)
          inputs:
            - set_java_version: "21"

      - restore-gradle-cache@2:
          title: Restore Gradle Dependency & Build Cache

      - script@1:
          title: Prepare Android SDK, Environment & Validate Gradle Wrapper
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail

                echo "==> Configuring Gradle JVM & worker limits for Bitrise Hobby Linux VM..."
                mkdir -p "$HOME/.gradle"
                cat > "$HOME/.gradle/gradle.properties" <<'EOF'
                org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
                org.gradle.daemon=false
                org.gradle.workers.max=2
                org.gradle.caching=true
                org.gradle.parallel=true
                EOF

                echo "==> Verifying Android SDK environment..."
                SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
                if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
                  echo "ERROR: ANDROID_HOME / ANDROID_SDK_ROOT is not set or directory does not exist."
                  exit 1
                fi
                export ANDROID_HOME="$SDK_ROOT"
                export ANDROID_SDK_ROOT="$SDK_ROOT"
                envman add --key ANDROID_HOME --value "$SDK_ROOT"
                envman add --key ANDROID_SDK_ROOT --value "$SDK_ROOT"

                SDKMANAGER_BIN=""
                if command -v sdkmanager >/dev/null 2>&1; then
                  SDKMANAGER_BIN="$(command -v sdkmanager)"
                elif [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
                  SDKMANAGER_BIN="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
                elif [ -x "$SDK_ROOT/tools/bin/sdkmanager" ]; then
                  SDKMANAGER_BIN="$SDK_ROOT/tools/bin/sdkmanager"
                fi

                if [ -n "$SDKMANAGER_BIN" ]; then
                  echo "==> Accepting Android SDK licenses & ensuring SDK 36 / 36.1 packages..."
                  yes | "$SDKMANAGER_BIN" --licenses >/dev/null 2>&1 || true
                  "$SDKMANAGER_BIN" --install \
                    "platform-tools" \
                    "build-tools;${ANDROID_BUILD_TOOLS}" \
                    "platforms;android-${ANDROID_COMPILE_SDK}" >/dev/null || true
                  "$SDKMANAGER_BIN" --install "platforms;android-36.1" >/dev/null 2>&1 || true
                fi

                echo "==> Preparing .env fallback for Secrets Gradle Plugin..."
                if [ ! -f ".env" ]; then
                  if [ -f ".env.example" ]; then
                    cp ".env.example" ".env"
                  else
                    touch ".env"
                  fi
                fi

                echo "==> Ensuring debug.keystore exists for signingConfigs.debugConfig..."
                if [ ! -f "debug.keystore" ]; then
                  keytool -genkeypair \
                    -v \
                    -keystore "debug.keystore" \
                    -storepass "android" \
                    -alias "androiddebugkey" \
                    -keypass "android" \
                    -keyalg RSA \
                    -keysize 2048 \
                    -validity 10000 \
                    -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
                fi

                echo "==> Validating Gradle Wrapper & Android project configuration..."
                if [ ! -f "./gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
                  echo "ERROR: Gradle wrapper files (gradlew / gradle-wrapper.jar) are missing from the repository."
                  exit 1
                fi
                chmod +x ./gradlew
                ./gradlew --version
                ./gradlew :app:help --no-daemon --stacktrace

      - script@1:
          title: Build PandaNex Debug APK (assembleDebug)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail

                echo "==> Building PandaNex Debug APK..."
                ./gradlew :app:assembleDebug \
                  --build-cache \
                  --no-daemon \
                  --stacktrace

      - script@1:
          title: Collect & Stage Debug APK Artifact
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail

                APK_DIR="app/build/outputs/apk/debug"
                APK_FILE="$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" | head -n 1 || true)"

                if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
                  echo "ERROR: Debug APK was not found in $APK_DIR"
                  ls -la "$APK_DIR" || true
                  exit 1
                fi

                mkdir -p "$BITRISE_DEPLOY_DIR"
                TARGET_APK="$BITRISE_DEPLOY_DIR/PandaNex-debug.apk"
                cp "$APK_FILE" "$TARGET_APK"

                envman add --key BITRISE_APK_PATH --value "$TARGET_APK"

                echo "========================================================"
                echo "PandaNex Debug APK Ready for Download"
                echo "Source Path : $APK_FILE"
                echo "Deploy Path : $TARGET_APK"
                echo "File Size   : $(du -h "$TARGET_APK" | cut -f1)"
                echo "SHA-256     : $(sha256sum "$TARGET_APK" | cut -d' ' -f1)"
                echo "========================================================"

      - save-gradle-cache@1:
          title: Save Gradle Dependency & Build Cache

      - deploy-to-bitrise-io@2:
          title: Deploy Debug APK to Bitrise Artifacts
          inputs:
            - deploy_path: "$BITRISE_DEPLOY_DIR"
            - is_compress: "false"
            - notify_user_groups: "none"

  # ============================================================================
  # Workflow 2: Signed Release APK Build (pandanex-release)
  # Builds, signs, verifies, and deploys PandaNex Release APK securely
  # ============================================================================
  pandanex-release:
    description: >-
      Builds and cryptographically verifies a signed PandaNex Release APK using
      Bitrise Code Signing or Bitrise Secrets, failing safely if credentials are missing.
    steps:
      - activate-ssh-key@4:
          title: Activate SSH Key (if SSH Git URL is used)
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'

      - git-clone@8:
          title: Clone PandaNex Repository (Shallow Clone)
          inputs:
            - clone_depth: "1"

      - set-java-version@1:
          title: Set JDK 21 (Compatible with Gradle 9.3.1 & AGP 9.1.1)
          inputs:
            - set_java_version: "21"

      - script@1:
          title: Validate & Configure Secure Android Release Signing
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail
                # Never echo commands containing signing credentials
                set +x

                echo "==> Validating Android release signing configuration..."

                KEYSTORE_URL_VAL="${BITRISEIO_ANDROID_KEYSTORE_URL:-}"
                KEYSTORE_B64_VAL="${KEYSTORE_BASE64:-}"

                RESOLVED_STORE_PASS="${BITRISEIO_ANDROID_KEYSTORE_PASSWORD:-${STORE_PASSWORD:-}}"
                RESOLVED_KEY_ALIAS="${BITRISEIO_ANDROID_KEYSTORE_ALIAS:-${KEY_ALIAS:-upload}}"
                RESOLVED_KEY_PASS="${BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD:-${KEY_PASSWORD:-}}"

                MISSING_ITEMS=()
                if [ -z "$KEYSTORE_URL_VAL" ] && [ -z "$KEYSTORE_B64_VAL" ]; then
                  MISSING_ITEMS+=("Keystore file (Upload keystore in Bitrise Code Signing tab OR set KEYSTORE_BASE64 Secret)")
                fi
                if [ -z "$RESOLVED_STORE_PASS" ]; then
                  MISSING_ITEMS+=("Keystore password (BITRISEIO_ANDROID_KEYSTORE_PASSWORD or STORE_PASSWORD Secret)")
                fi
                if [ -z "$RESOLVED_KEY_PASS" ]; then
                  MISSING_ITEMS+=("Private key password (BITRISEIO_ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD or KEY_PASSWORD Secret)")
                fi

                if [ "${#MISSING_ITEMS[@]}" -gt 0 ]; then
                  echo "=================================================================="
                  echo "ERROR: Release signing credentials are missing. Aborting safely."
                  echo "Configure signing in Bitrise -> Workflow Editor -> Code Signing"
                  echo "(Android Keystore section) OR in Bitrise -> Secrets:"
                  for item in "${MISSING_ITEMS[@]}"; do
                    echo "  - Missing: $item"
                  done
                  echo "=================================================================="
                  exit 1
                fi

                TEMP_KEYSTORE="${BITRISE_TMP_DIR:-/tmp}/pandanex-release-signing.jks"
                rm -f "$TEMP_KEYSTORE"
                umask 077

                if [ -n "$KEYSTORE_URL_VAL" ]; then
                  echo "==> Downloading keystore from Bitrise Secure Code Signing storage..."
                  curl -fsSL "$KEYSTORE_URL_VAL" -o "$TEMP_KEYSTORE"
                else
                  echo "==> Decoding keystore from secure KEYSTORE_BASE64 Secret..."
                  printf '%s' "$KEYSTORE_B64_VAL" | tr -d ' \n\r\t' | base64 -d > "$TEMP_KEYSTORE"
                fi

                if [ ! -s "$TEMP_KEYSTORE" ]; then
                  echo "ERROR: Materialized keystore file is empty or unreadable."
                  rm -f "$TEMP_KEYSTORE"
                  exit 1
                fi

                echo "==> Verifying keystore integrity and key alias..."
                if ! keytool -list -keystore "$TEMP_KEYSTORE" -storepass "$RESOLVED_STORE_PASS" >/dev/null 2>&1; then
                  echo "ERROR: Keystore verification failed. Check your Keystore file and Keystore password."
                  rm -f "$TEMP_KEYSTORE"
                  exit 1
                fi

                if ! keytool -list -keystore "$TEMP_KEYSTORE" -storepass "$RESOLVED_STORE_PASS" -alias "$RESOLVED_KEY_ALIAS" >/dev/null 2>&1; then
                  echo "ERROR: Alias '$RESOLVED_KEY_ALIAS' was not found in the provided keystore."
                  rm -f "$TEMP_KEYSTORE"
                  exit 1
                fi

                # app/build.gradle.kts signingConfigs.release expects keyAlias = "upload".
                # If the uploaded keystore uses a different alias, safely normalize the temporary copy.
                if [ "$RESOLVED_KEY_ALIAS" != "upload" ]; then
                  echo "==> Mapping keystore alias '$RESOLVED_KEY_ALIAS' -> 'upload' in temporary CI keystore..."
                  keytool -changealias \
                    -keystore "$TEMP_KEYSTORE" \
                    -storepass "$RESOLVED_STORE_PASS" \
                    -alias "$RESOLVED_KEY_ALIAS" \
                    -destalias "upload" \
                    -keypass "$RESOLVED_KEY_PASS" >/dev/null 2>&1
                fi

                printf '%s' "$TEMP_KEYSTORE" | envman add --key KEYSTORE_PATH
                printf '%s' "$RESOLVED_STORE_PASS" | envman add --key STORE_PASSWORD
                printf '%s' "$RESOLVED_KEY_PASS" | envman add --key KEY_PASSWORD

                echo "==> Release signing credentials validated and exported securely."

      - restore-gradle-cache@2:
          title: Restore Gradle Dependency & Build Cache

      - script@1:
          title: Prepare Android SDK, Environment & Validate Gradle Wrapper
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail

                echo "==> Configuring Gradle JVM & worker limits for Bitrise Hobby Linux VM..."
                mkdir -p "$HOME/.gradle"
                cat > "$HOME/.gradle/gradle.properties" <<'EOF'
                org.gradle.jvmargs=-Xmx3584m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
                org.gradle.daemon=false
                org.gradle.workers.max=2
                org.gradle.caching=true
                org.gradle.parallel=true
                EOF

                SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
                if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
                  echo "ERROR: ANDROID_HOME / ANDROID_SDK_ROOT is not set or directory does not exist."
                  exit 1
                fi
                export ANDROID_HOME="$SDK_ROOT"
                export ANDROID_SDK_ROOT="$SDK_ROOT"
                envman add --key ANDROID_HOME --value "$SDK_ROOT"
                envman add --key ANDROID_SDK_ROOT --value "$SDK_ROOT"

                SDKMANAGER_BIN=""
                if command -v sdkmanager >/dev/null 2>&1; then
                  SDKMANAGER_BIN="$(command -v sdkmanager)"
                elif [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
                  SDKMANAGER_BIN="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
                elif [ -x "$SDK_ROOT/tools/bin/sdkmanager" ]; then
                  SDKMANAGER_BIN="$SDK_ROOT/tools/bin/sdkmanager"
                fi

                if [ -n "$SDKMANAGER_BIN" ]; then
                  echo "==> Accepting Android SDK licenses & ensuring SDK 36 / 36.1 packages..."
                  yes | "$SDKMANAGER_BIN" --licenses >/dev/null 2>&1 || true
                  "$SDKMANAGER_BIN" --install \
                    "platform-tools" \
                    "build-tools;${ANDROID_BUILD_TOOLS}" \
                    "platforms;android-${ANDROID_COMPILE_SDK}" >/dev/null || true
                  "$SDKMANAGER_BIN" --install "platforms;android-36.1" >/dev/null 2>&1 || true
                fi

                if [ ! -f ".env" ]; then
                  if [ -f ".env.example" ]; then
                    cp ".env.example" ".env"
                  else
                    touch ".env"
                  fi
                fi

                if [ ! -f "debug.keystore" ]; then
                  keytool -genkeypair \
                    -v \
                    -keystore "debug.keystore" \
                    -storepass "android" \
                    -alias "androiddebugkey" \
                    -keypass "android" \
                    -keyalg RSA \
                    -keysize 2048 \
                    -validity 10000 \
                    -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
                fi

                if [ ! -f "./gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
                  echo "ERROR: Gradle wrapper files (gradlew / gradle-wrapper.jar) are missing from the repository."
                  exit 1
                fi
                chmod +x ./gradlew
                ./gradlew --version

      - script@1:
          title: Build Signed PandaNex Release APK (assembleRelease)
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail

                echo "==> Building signed PandaNex Release APK..."
                ./gradlew :app:assembleRelease \
                  --build-cache \
                  --no-configuration-cache \
                  --no-daemon \
                  --stacktrace

      - script@1:
          title: Verify APK Signature & Stage Release APK Artifact
          inputs:
            - content: |-
                #!/usr/bin/env bash
                set -euo pipefail

                APK_DIR="app/build/outputs/apk/release"
                SIGNED_APK="$(find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" ! -name "*unsigned*" | head -n 1 || true)"

                if [ -z "$SIGNED_APK" ] || [ ! -f "$SIGNED_APK" ]; then
                  echo "ERROR: Signed Release APK was not found in $APK_DIR. Check signing credentials."
                  ls -la "$APK_DIR" || true
                  exit 1
                fi

                SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
                APKSIGNER_BIN=""
                if command -v apksigner >/dev/null 2>&1; then
                  APKSIGNER_BIN="$(command -v apksigner)"
                elif [ -n "$SDK_ROOT" ] && [ -d "$SDK_ROOT/build-tools" ]; then
                  APKSIGNER_BIN="$(find "$SDK_ROOT/build-tools" -type f -name "apksigner" | sort -V | tail -n 1 || true)"
                fi

                if [ -n "$APKSIGNER_BIN" ]; then
                  echo "==> Verifying cryptographic APK signature with apksigner..."
                  "$APKSIGNER_BIN" verify --verbose "$SIGNED_APK"
                fi

                mkdir -p "$BITRISE_DEPLOY_DIR"
                TARGET_APK="$BITRISE_DEPLOY_DIR/PandaNex-release.apk"
                cp "$SIGNED_APK" "$TARGET_APK"

                envman add --key BITRISE_APK_PATH --value "$TARGET_APK"

                echo "========================================================"
                echo "PandaNex Signed Release APK Ready for Download"
                echo "Source Path : $SIGNED_APK"
                echo "Deploy Path : $TARGET_APK"
                echo "File Size   : $(du -h "$TARGET_APK" | cut -f1)"
                echo "SHA-256     : $(sha256sum "$TARGET_APK" | cut -d' ' -f1)"
                echo "========================================================"

      - script@1:
          title: Clean Up Temporary Signing Keystore
          is_always_run: true
          inputs:
            - content: |-
                #!/usr/bin/env bash
                TEMP_KEYSTORE="${BITRISE_TMP_DIR:-/tmp}/pandanex-release-signing.jks"
                if [ -f "$TEMP_KEYSTORE" ]; then
                  rm -f "$TEMP_KEYSTORE"
                  echo "==> Temporary release keystore securely removed."
                fi

      - save-gradle-cache@1:
          title: Save Gradle Dependency & Build Cache

      - deploy-to-bitrise-io@2:
          title: Deploy Signed Release APK to Bitrise Artifacts
          inputs:
            - deploy_path: "$BITRISE_DEPLOY_DIR"
            - is_compress: "false"
            - notify_user_groups: "none"
