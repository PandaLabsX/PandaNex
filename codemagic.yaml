workflows:
  pandanex-debug:
    name: PandaNex Debug APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 21
      vars:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
          source: true
    scripts:
      - name: Configure Android SDK & Accept Licenses
        script: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "ERROR: ANDROID_SDK_ROOT / ANDROID_HOME is not set on this build image."
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$CM_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$CM_ENV"

          # Accept all Android SDK licenses so AGP 9.1.1 can resolve compileSdk 36.1 automatically
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

          # Pre-install platform-tools, build-tools 36.0.0, and Android 36 / 36.1 platforms if available
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36" > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36.1" > /dev/null 2>&1 || true

      - name: Prepare Environment & Debug Keystore
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          # Ensure .env exists for Secrets Gradle Plugin (falls back cleanly to .env.example)
          if [ ! -f ".env" ]; then
            cp ".env.example" ".env"
          fi

          # Ensure debug.keystore exists at project root as configured in app/build.gradle.kts (debugConfig)
          if [ ! -f "$CM_BUILD_DIR/debug.keystore" ]; then
            if [ -f "$CM_BUILD_DIR/debug.keystore.base64" ]; then
              base64 --decode "$CM_BUILD_DIR/debug.keystore.base64" > "$CM_BUILD_DIR/debug.keystore"
            else
              keytool -genkeypair -v \
                -keystore "$CM_BUILD_DIR/debug.keystore" \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Validate Gradle Wrapper & Project Configuration
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          if [ ! -f "./gradlew" ] || [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: Gradle wrapper files (gradlew / gradle-wrapper.jar) are missing from the repository."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --version
          ./gradlew help --stacktrace

      - name: Build PandaNex Debug APK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify Generated Debug APK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          APK_FILES=$(ls app/build/outputs/apk/debug/*.apk 2>/dev/null || true)
          if [ -z "$APK_FILES" ]; then
            echo "ERROR: No Debug APK was found in app/build/outputs/apk/debug/"
            exit 1
          fi
          echo "Successfully generated Debug APK(s):"
          ls -lh app/build/outputs/apk/debug/*.apk
          sha256sum app/build/outputs/apk/debug/*.apk
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - app/build/reports/**

  pandanex-release:
    name: PandaNex Signed Release APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      groups:
        - pandanex_signing
      java: 21
      vars:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8"
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Validate & Configure Release Signing Credentials
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          # Support either KEYSTORE_BASE64 / CM_KEYSTORE (base64 env var) or CM_KEYSTORE_PATH (Codemagic keystore file)
          RESOLVED_KEYSTORE_B64="${KEYSTORE_BASE64:-${CM_KEYSTORE:-}}"
          RESOLVED_KEYSTORE_FILE="${CM_KEYSTORE_PATH:-}"
          RESOLVED_STORE_PASSWORD="${STORE_PASSWORD:-${CM_KEYSTORE_PASSWORD:-}}"
          RESOLVED_KEY_PASSWORD="${KEY_PASSWORD:-${CM_KEY_PASSWORD:-}}"
          RESOLVED_KEY_ALIAS="${KEY_ALIAS:-${CM_KEY_ALIAS:-upload}}"

          MISSING_VARS=()
          if [ -z "$RESOLVED_KEYSTORE_B64" ] && [ -z "$RESOLVED_KEYSTORE_FILE" ]; then
            MISSING_VARS+=("KEYSTORE_BASE64 (or CM_KEYSTORE / CM_KEYSTORE_PATH)")
          fi
          if [ -z "$RESOLVED_STORE_PASSWORD" ]; then
            MISSING_VARS+=("STORE_PASSWORD (or CM_KEYSTORE_PASSWORD)")
          fi
          if [ -z "$RESOLVED_KEY_PASSWORD" ]; then
            MISSING_VARS+=("KEY_PASSWORD (or CM_KEY_PASSWORD)")
          fi

          if [ "${#MISSING_VARS[@]}" -gt 0 ]; then
            echo "=================================================================="
            echo "ERROR: Missing required Android Release signing credentials!"
            echo "Missing variable(s): ${MISSING_VARS[*]}"
            echo "Configure these as Secure Environment Variables in Codemagic under"
            echo "variable group 'pandanex_signing' before running pandanex-release."
            echo "=================================================================="
            exit 1
          fi

          TEMP_KEYSTORE="$CM_BUILD_DIR/pandanex-release-signing.jks"
          if [ -n "$RESOLVED_KEYSTORE_FILE" ] && [ -f "$RESOLVED_KEYSTORE_FILE" ]; then
            cp "$RESOLVED_KEYSTORE_FILE" "$TEMP_KEYSTORE"
          else
            printf "%s" "$RESOLVED_KEYSTORE_B64" | tr -d ' \n\r\t' | base64 --decode > "$TEMP_KEYSTORE"
          fi

          if [ ! -s "$TEMP_KEYSTORE" ]; then
            echo "ERROR: Decoded keystore file is empty or invalid base64."
            rm -f "$TEMP_KEYSTORE"
            exit 1
          fi

          # Verify keystore integrity and normalize alias to 'upload' if a custom KEY_ALIAS was supplied
          if ! keytool -list -keystore "$TEMP_KEYSTORE" -storepass "$RESOLVED_STORE_PASSWORD" > /dev/null 2>&1; then
            echo "ERROR: Unable to open keystore with the provided STORE_PASSWORD."
            rm -f "$TEMP_KEYSTORE"
            exit 1
          fi

          if [ "$RESOLVED_KEY_ALIAS" != "upload" ]; then
            keytool -changealias \
              -keystore "$TEMP_KEYSTORE" \
              -storepass "$RESOLVED_STORE_PASSWORD" \
              -keypass "$RESOLVED_KEY_PASSWORD" \
              -alias "$RESOLVED_KEY_ALIAS" \
              -destalias "upload"
          fi

          # Export signing variables expected by app/build.gradle.kts (signingConfigs.release)
          {
            echo "KEYSTORE_PATH=$TEMP_KEYSTORE"
            echo "STORE_PASSWORD=$RESOLVED_STORE_PASSWORD"
            echo "KEY_PASSWORD=$RESOLVED_KEY_PASSWORD"
          } >> "$CM_ENV"

          echo "Release signing credentials validated securely."

      - name: Configure Android SDK & Prepare Environment
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$ANDROID_SDK_ROOT" ]; then
            echo "ERROR: ANDROID_SDK_ROOT / ANDROID_HOME is not set on this build image."
            exit 1
          fi
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$CM_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$CM_ENV"

          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36" > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36.1" > /dev/null 2>&1 || true

          if [ ! -f ".env" ]; then
            cp ".env.example" ".env"
          fi

          # Also ensure debug.keystore file reference exists so Gradle configuration phase validates cleanly
          if [ ! -f "$CM_BUILD_DIR/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$CM_BUILD_DIR/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          chmod +x ./gradlew
          ./gradlew --version

      - name: Build Signed PandaNex Release APK
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          ./gradlew :app:assembleRelease --stacktrace

      - name: Verify Signed Release APK & Clean Up Keystore
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"

          # Always remove temporary signing keystore before finishing
          rm -f "$CM_BUILD_DIR/pandanex-release-signing.jks"

          APK_FILES=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null || true)
          if [ -z "$APK_FILES" ]; then
            echo "ERROR: No Release APK was found in app/build/outputs/apk/release/"
            exit 1
          fi

          # Locate apksigner to verify APK v2/v3 cryptographic signature
          APKSIGNER_BIN=$(find "$ANDROID_SDK_ROOT/build-tools" -name "apksigner" | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER_BIN" ]; then
            for apk in app/build/outputs/apk/release/*.apk; do
              "$APKSIGNER_BIN" verify --verbose "$apk"
            done
          fi

          echo "Successfully generated signed Release APK(s):"
          ls -lh app/build/outputs/apk/release/*.apk
          sha256sum app/build/outputs/apk/release/*.apk
    publishing:
      scripts:
        - name: Ensure Temporary Signing Files Are Removed
          script: |
            rm -f "$CM_BUILD_DIR/pandanex-release-signing.jks"
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/mapping/release/**/mapping.txt
      - app/build/reports/**
